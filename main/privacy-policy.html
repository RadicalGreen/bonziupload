<!DOCTYPE html>
 <html>
 <head>
 <title>Privacy Policy</title>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
 <style>
 body {
 margin: 0;
 padding: 0;
 font-family: "Tahoma", sans-serif;
 background-color: #6d33a0;
 }
 
 #content {
 width: 75%;
 max-width: 800px;
 margin: 40px auto;
 padding: 24px;
 background: rgba(255, 255, 225, 0.9);
 border-radius: 9px;
 text-align: center;
 }
 
 .upload-box {
 border: 3px dashed #6d33a0;
 border-radius: 12px;
 padding: 40px;
 background: #fdfde7;
 color: #444;
 cursor: pointer;
 font-size: 18px;
 transition: 0.2s;
 }
 
 .upload-box:hover {
 background: #f3e9ff;
 border-color: #50287c;
 }
 
 #fileInput { display: none; }
 
 #progressContainer {
 margin-top: 20px;
 width: 100%;
 display: none;
 }
 
 #progressBar {
 width: 0%;
 height: 20px;
 background-color: #6d33a0;
 border-radius: 10px;
 transition: width 0.2s;
 }
 
 #progressText {
 margin-top: 8px;
 }
 
 #linkContainer {
 display: none;
 margin-top: 20px;
 background: #eee;
 padding: 10px;
 border-radius: 8px;
 }
 
 #fileLink {
 word-break: break-all;
 color: #333;
 text-decoration: none;
 }
 
 #copyBtn {
 margin-top: 8px;
 padding: 6px 12px;
 background: #6d33a0;
 color: white;
 border: none;
 border-radius: 6px;
 cursor: pointer;
 }
 
 #copyBtn:hover {
 background: #54297f;
 }
 </style>
 </head>
 <body>
 <div id="content">
 <img src="./website/newlogo.png">
 <hr>
 <h2>Privacy Policy</h2>
 <p>We do not sell your personal information anywhere while you upload files, including to advertisers. Your data is all safe. Cookies are used to show you ads, not for your data.</p>
</div>
